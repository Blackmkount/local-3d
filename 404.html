<script>
/* ============================================================================
   ENLACES CORTOS — GitHub Pages (y http-server) muestran esta página para
   cualquier dirección que no existe. Si la dirección es un enlace corto, se
   abre la parte del local que nombra, sin pasar por el error:
     …/local-3d/7  o  …/local-3d/m7   →  …/local-3d/#m7   (ficha del mueble 7)
     …/local-3d/presupuesto           →  …/local-3d/#presupuesto
   (también materiales, montaje, historia y recorrido). Así caben en los
   códigos QR de las etiquetas (tools/qr/). Va en <head> para saltar antes de
   dibujar nada.
   ========================================================================== */
(function () {
  'use strict';
  var p = location.pathname;
  var m = /^(.*\/)m?([1-9][0-9]?)\/?$/i.exec(p);
  var r = /^(.*\/)(presupuesto|materiales|montaje|historia|recorrido)\/?$/i.exec(p);
  var base = null, ruta = null;
  if (m) { base = m[1]; ruta = 'm' + m[2]; }
  else if (r) { base = r[1]; ruta = r[2].toLowerCase(); }
  if (ruta) location.replace(base + location.search + '#' + ruta);
})();
</script>

<script>
/* «Volver a la tienda»: en GitHub Pages el sitio vive en la primera carpeta (/local-3d/); en un servidor
   local, en la raíz. Sin JavaScript el botón lleva a la dirección publicada. */
(function () {
  'use strict';
  var seg = location.pathname.split('/').filter(Boolean);
  var base = /\.github\.io$/i.test(location.hostname) && seg.length ? '/' + seg[0] + '/' : '/';
  document.getElementById('home').href = base;
})();
