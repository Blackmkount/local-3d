# Revisión automática de cada cambio: estilo del código (ESLint), cuentas del
# presupuesto y archivos publicados (node --test) y el recorrido en un navegador
# de verdad (Playwright, con el 3D dibujado por software).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Lint, datos y navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Pruebas de datos y publicación
        run: npm test

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas en el navegador
        run: npm run test:e2e

      - name: Guardar el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
